name: Build installers

on:
  push:
    branches: [main]    # every push to main: test builds under the run's Artifacts
    tags: ["v*"]        # push a tag like v1.0 to also publish a release
  workflow_dispatch:     # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build Mousync.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Mousync --icon assets/icon.ico --add-data "assets;assets" --hidden-import pystray._win32 mousync.py
      - name: Portable exe (no install needed, just double-click)
        run: Copy-Item dist\Mousync.exe Mousync-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Mousync-Windows-Portable
          path: Mousync-Portable.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Mousync-Windows
          path: Output/Mousync-Setup.exe

  macos:
    runs-on: macos-latest   # Apple Silicon (M1/M2/M3/M4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build Mousync.app
        run: |
          pyinstaller --noconfirm --windowed --name Mousync \
            --icon assets/icon.icns --add-data "assets:assets" --hidden-import pystray._darwin \
            --osx-bundle-identifier in.dhavalverma.mousync mousync.py
          codesign --force --deep --sign - dist/Mousync.app
      - name: Build DMG
        run: |
          mkdir dmg
          cp -R dist/Mousync.app dmg/
          ln -s /Applications dmg/Applications
          cp assets/icon.icns dmg/.VolumeIcon.icns      # icon for the mounted disk
          SetFile -c icnC dmg/.VolumeIcon.icns
          SetFile -a C dmg
          hdiutil create -volname Mousync -srcfolder dmg -ov -format UDZO Mousync.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Mousync-macOS
          path: Mousync.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Mousync-Windows/Mousync-Setup.exe
            out/Mousync-Windows-Portable/Mousync-Portable.exe
            out/Mousync-macOS/Mousync.dmg
